name: Daily NSE Update

on:
  schedule:
    - cron: '30 13 * * *'  # 7:00 PM IST
    - cron: '0 15 * * *'   # 8:30 PM IST
    - cron: '30 16 * * *'  # 10:00 PM IST
    - cron: '30 2 * * *'   # 8:00 AM IST
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # important to allow pulling

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest changes from main before modifying
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git fetch origin main
          git pull --rebase origin main

      - name: Run update script
        run: python update_data.py

      - name: Commit and push updated CSVs
        run: |
          git add data/*.csv
          git commit -m "Auto-update CSVs [skip ci]" || echo "No changes to commit"
          git push origin main
