<!DOCTYPE html>
<html>
<head>
    <title>NSE Daily Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 40px;
            font-size: 20px; /* Good readable size */
            line-height: 1.7;
            color: #222;
        }

        pre {
            background-color: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: inherit; /* Keeps consistent with body font */
        }

        h1 {
            font-size: 32px;
            color: #007bff;
            margin-bottom: 25px;
        }

        .timestamp {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>📈 NSE Daily PE×PB Analysis</h1>
    <div class="timestamp">Last updated: {{ now }}</div>
    <pre>{{ report | replace('\n', '<br>') | safe }}</pre>
</body>
</html>
